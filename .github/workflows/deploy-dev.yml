name: Deploy to Server

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/*'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'bin/*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.WFP_ID_RSA }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan "47.243.145.149" >> ~/.ssh/known_hosts
          
      - name: Deploy to Server
        run: |
          ssh work@47.243.145.149 "
            set -e
            
            # 切换到工作目录
            WORK_DIR=\"/home/work/imooc-lego/biz-editor-server\"
            mkdir -p \$WORK_DIR
            cd \$WORK_DIR
            
            # 方法1：强制更新到最新代码（推荐）
            if [ -d .git ]; then
              # 如果已经有 git 仓库，强制重置
              git fetch --all
              git reset --hard origin/main
            else
              # 如果没有，重新克隆
              cd /home/work/imooc-lego
              rm -rf biz-editor-server
              git clone --branch main https://github.com/StupidBoy2333/biz-editor-server.git
              cd biz-editor-server
            fi
            
            # 启动 Docker（假设权限问题已解决）
            docker compose build --no-cache editor-server
            docker compose up -d
            
            # 清理旧的 Docker 镜像
            docker image prune -f
          "
          
      - name: Cleanup SSH key
        run: rm -rf ~/.ssh/id_rsa