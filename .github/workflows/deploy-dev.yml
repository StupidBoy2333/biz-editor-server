name: Deploy to Server

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/*'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'bin/*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.WFP_ID_RSA }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan "47.243.145.149" >> ~/.ssh/known_hosts
          
      - name: Deploy to Server
        run: |
          ssh work@47.243.145.149 "
            set -e
            
            # 切换到工作目录
            WORK_DIR=\"/home/work/imooc-lego/biz-editor-server\"
            mkdir -p \$WORK_DIR
            cd \$WORK_DIR
            
            # 配置 git
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/StupidBoy2333/biz-editor-server.git
            fi
            
            # 拉取 main 分支最新代码
            git fetch origin
            git checkout main
            git reset --hard origin/main
            
            # 清理敏感信息
            git remote remove origin || true
            
            # 构建并启动 Docker
            docker compose build --no-cache editor-server
            docker compose up -d
            
            # 清理旧的 Docker 镜像
            docker image prune -f
          "
          
      - name: Cleanup SSH key
        run: rm -rf ~/.ssh/id_rsa